<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Detail | Zonian Dictionary</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand-wrap">
          <div class="brand-mark">Z</div>
          <div>
            <p class="eyebrow">Language portal</p>
            <h1>Zonian Dictionary</h1>
          </div>
        </div>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">ホーム</a>
          <a href="index.html#search">検索</a>
        </nav>
      </div>
    </header>

    <main class="detail-page">
      <div class="container">
        <a class="back-link" href="index.html">← 一覧へ戻る</a>
        <article class="detail-card">
          <h2 id="detail-query">-</h2>

          <div class="example-block">
            <p class="example-label">用例</p>
            <p class="example" id="detail-example">-</p>
          </div>
        </article>
      </div>
    </main>

    <script src="detail.js"></script>
